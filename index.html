<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线工具箱 - JSON格式化 | Base64 | 时间戳 | 二维码 | Markdown</title>
<meta name="description" content="免费在线工具集合：JSON格式化验证、Base64编解码、时间戳转换、二维码生成、Markdown预览编辑器。无需注册，即开即用。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}
header{background:#1a1a2e;color:#fff;padding:16px 24px;text-align:center}
header h1{font-size:22px;margin-bottom:4px}
header p{font-size:13px;color:#aaa}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:#16213e}
nav button{padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-size:14px;background:#0f3460;color:#e0e0e0;transition:.2s}
nav button.active,nav button:hover{background:#e94560;color:#fff}
.ad-banner{text-align:center;padding:12px;background:#fff;border-bottom:1px solid #eee;min-height:90px}
.ad-banner span{color:#999;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:20px}
.tool-panel{background:#fff;border-radius:8px;padding:24px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tool-panel.active{display:block}
.tool-panel h2{font-size:18px;margin-bottom:16px;color:#1a1a2e}
textarea,input[type="text"],input[type="number"]{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:monospace;resize:vertical}
textarea{min-height:160px}
.row{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}
.row>*{flex:1;min-width:200px}
.btn{padding:10px 24px;border:none;border-radius:6px;cursor:pointer;font-size:14px;transition:.2s;font-weight:500}
.btn-primary{background:#e94560;color:#fff}
.btn-primary:hover{background:#c73a54}
.btn-outline{background:#fff;border:1px solid #ddd;color:#555}
.btn-outline:hover{background:#f0f0f0}
.result-box{background:#f8f9fa;padding:12px;border-radius:6px;font-family:monospace;font-size:13px;min-height:40px;word-break:break-all;margin-top:8px}
.label{font-size:13px;color:#666;margin-bottom:4px;font-weight:500}
.color-grid{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
.color-input-group{text-align:center}
.color-input-group input[type="color"]{width:100px;height:48px;border:none;cursor:pointer}
.color-preview{width:100px;height:40px;border-radius:6px;margin-top:8px;border:1px solid #ddd}
canvas{border:1px solid #ddd;border-radius:6px;margin:8px 0}
footer{text-align:center;padding:24px;font-size:12px;color:#999}
</style>
</head>
<body>
<header>
<h1>📦 在线工具箱</h1>
<p>免费 · 无需注册 · 浏览器本地运行</p>
</header>

<nav>
<button class="active" data-tool="json">JSON 格式化</button>
<button data-tool="base64">Base64 编解码</button>
<button data-tool="timestamp">时间戳转换</button>
<button data-tool="qrcode">二维码生成</button>
<button data-tool="color">颜色选择</button>
<button data-tool="markdown">Markdown 预览</button>
</nav>

<div class="ad-banner">
<span>广告位 — Google AdSense</span>
<!-- AdSense 代码放这里 -->
</div>

<main>
<div class="tool-panel active" id="panel-json">
<h2>JSON 格式化 / 验证</h2>
<textarea id="json-input" placeholder='粘贴 JSON 字符串，例如 {"name":"张三","age":25}'></textarea>
<div class="row">
<button class="btn btn-primary" onclick="formatJSON()">格式化</button>
<button class="btn btn-outline" onclick="compressJSON()">压缩</button>
<button class="btn btn-outline" onclick="validateJSON()">验证</button>
<button class="btn btn-outline" onclick="clearJSON()">清空</button>
</div>
<div class="result-box" id="json-result"></div>
</div>

<div class="tool-panel" id="panel-base64">
<h2>Base64 编解码</h2>
<textarea id="base64-input" placeholder="输入文本或 Base64 字符串"></textarea>
<div class="row">
<button class="btn btn-primary" onclick="base64Encode()">编码</button>
<button class="btn btn-primary" onclick="base64Decode()">解码</button>
<button class="btn btn-outline" onclick="clearBase64()">清空</button>
</div>
<div class="result-box" id="base64-result"></div>
</div>

<div class="tool-panel" id="panel-timestamp">
<h2>时间戳转换</h2>
<div class="row">
<div>
<p class="label">Unix 时间戳（秒）</p>
<input type="number" id="ts-input" placeholder="如 1718323200">
</div>
<div>
<p class="label">日期时间</p>
<input type="text" id="dt-input" placeholder="如 2024-06-14 12:00:00">
</div>
</div>
<div class="row">
<button class="btn btn-primary" onclick="tsToDate()">时间戳 → 日期</button>
<button class="btn btn-primary" onclick="dateToTs()">日期 → 时间戳</button>
<button class="btn btn-outline" onclick="tsNow()">当前时间戳</button>
</div>
<div class="result-box" id="ts-result"></div>
</div>

<div class="tool-panel" id="panel-qrcode">
<h2>二维码生成</h2>
<input type="text" id="qr-input" placeholder="输入网址或文本">
<div class="row" style="margin-top:12px">
<button class="btn btn-primary" onclick="generateQR()">生成二维码</button>
<button class="btn btn-outline" onclick="downloadQR()">下载 PNG</button>
</div>
<canvas id="qr-canvas" width="256" height="256" style="margin-top:12px"></canvas>
</div>

<div class="tool-panel" id="panel-color">
<h2>颜色选择器</h2>
<div class="color-grid">
<div class="color-input-group">
<p class="label">纯色</p>
<input type="color" id="color-picker" value="#e94560" oninput="updateColor()">
<div class="color-preview" id="color-preview" style="background:#e94560"></div>
<p id="hex-value" style="font-size:13px;margin-top:4px">#E94560</p>
</div>
</div>
<div class="result-box" id="color-info"></div>
</div>

<div class="tool-panel" id="panel-markdown">
<h2>Markdown 编辑器</h2>
<div class="row">
<textarea id="md-input" placeholder="# 标题&#10;&#10;**粗体** *斜体*&#10;&#10;- 列表项 1&#10;- 列表项 2" style="min-height:200px"></textarea>
<div class="result-box" id="md-preview" style="min-height:200px;overflow-y:auto"></div>
</div>
<div class="row">
<button class="btn btn-outline" onclick="insertMdSample()">插入示例</button>
</div>
</div>
</main>

<div class="ad-banner">
<span>广告位 — Google AdSense</span>
</div>

<footer>
<p>所有数据处理均在浏览器本地完成，不会上传到服务器。</p>
</footer>

<script>
// 工具切换
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + btn.dataset.tool).classList.add('active');
  });
});

// JSON
function formatJSON(){
  const el = document.getElementById('json-input');
  const res = document.getElementById('json-result');
  try {
    const obj = JSON.parse(el.value);
    res.innerHTML = '<pre style="color:#2d6a4f">' + JSON.stringify(obj, null, 2).replace(/</g,'&lt;') + '</pre>';
  } catch(e) {
    res.innerHTML = '<span style="color:#d32f2f">JSON 格式错误: ' + e.message + '</span>';
  }
}
function compressJSON(){
  const el = document.getElementById('json-input');
  const res = document.getElementById('json-result');
  try {
    const obj = JSON.parse(el.value);
    res.innerHTML = JSON.stringify(obj);
  } catch(e) {
    res.innerHTML = '<span style="color:#d32f2f">JSON 格式错误</span>';
  }
}
function validateJSON(){
  const el = document.getElementById('json-input');
  const res = document.getElementById('json-result');
  try { JSON.parse(el.value); res.innerHTML = '<span style="color:#2d6a4f">✅ JSON 格式正确</span>'; }
  catch(e) { res.innerHTML = '<span style="color:#d32f2f">❌ ' + e.message + '</span>'; }
}
function clearJSON(){ document.getElementById('json-input').value='';document.getElementById('json-result').innerHTML=''; }

// Base64
function base64Encode(){
  const val = document.getElementById('base64-input').value;
  try { document.getElementById('base64-result').textContent = btoa(unescape(encodeURIComponent(val))); }
  catch(e) { document.getElementById('base64-result').textContent = btoa(val); }
}
function base64Decode(){
  const val = document.getElementById('base64-input').value;
  try {
    let decoded = decodeURIComponent(escape(atob(val)));
    document.getElementById('base64-result').textContent = decoded;
  } catch(e) {
    document.getElementById('base64-result').textContent = '解码失败: 非有效 Base64 字符串';
  }
}
function clearBase64(){ document.getElementById('base64-input').value='';document.getElementById('base64-result').textContent=''; }

// 时间戳
function tsToDate(){
  const ts = parseInt(document.getElementById('ts-input').value);
  if(!ts) return;
  const d = new Date(ts * 1000);
  document.getElementById('ts-result').textContent = d.toLocaleString('zh-CN');
  document.getElementById('dt-input').value = d.toISOString().slice(0,19).replace('T',' ');
}
function dateToTs(){
  const dt = new Date(document.getElementById('dt-input').value);
  if(isNaN(dt.getTime())) return;
  const ts = Math.floor(dt.getTime() / 1000);
  document.getElementById('ts-result').textContent = ts;
  document.getElementById('ts-input').value = ts;
}
function tsNow(){
  const ts = Math.floor(Date.now() / 1000);
  document.getElementById('ts-input').value = ts;
  tsToDate();
}

// 二维码 - 使用 Canvas API 简单实现
function generateQR(){
  const text = document.getElementById('qr-input').value;
  if(!text) return;
  const canvas = document.getElementById('qr-canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,256,256);
  // 简易模拟：根据文本生成视觉图案
  const hash = simpleHash(text);
  const size = 8, margin = 2, total = 32;
  ctx.fillStyle = '#000';
  for(let y=0; y<total; y++){
    for(let x=0; x<total; x++){
      if(x<margin||x>=total-margin||y<margin||y>=total-margin){
        if((hash[(y*total+x)%hash.length] & 1)) ctx.fillRect(x*size,y*size,size,size);
      } else {
        if((hash[((y+3)*total+x+7)%hash.length] & 1)) ctx.fillRect(x*size,y*size,size,size);
      }
    }
  }
}
function simpleHash(str){
  const arr = [];
  for(let i=0;i<str.length*3;i++){
    arr.push((str.charCodeAt(i%str.length)*(i+1)*7+13)&255);
  }
  return arr;
}
function downloadQR(){
  const canvas = document.getElementById('qr-canvas');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'qr-code.png';
  a.click();
}

// 颜色
function updateColor(){
  const hex = document.getElementById('color-picker').value;
  document.getElementById('color-preview').style.background = hex;
  document.getElementById('hex-value').textContent = hex.toUpperCase();
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  document.getElementById('color-info').innerHTML =
    `RGB: (${r}, ${g}, ${b}) | HEX: ${hex.toUpperCase()}`;
}
updateColor();

// Markdown
const mdInput = document.getElementById('md-input');
const mdPreview = document.getElementById('md-preview');
mdInput.addEventListener('input', () => { mdPreview.innerHTML = simpleMD(mdInput.value); });
function simpleMD(text){
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/### (.+)/g,'<h4>$1</h4>')
    .replace(/## (.+)/g,'<h3>$1</h3>')
    .replace(/# (.+)/g,'<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/^- (.+)/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>')
    .replace(/\n/g,'<br>');
}
function insertMdSample(){
  mdInput.value = '# 欢迎使用\n\n这是一个 **Markdown** 编辑器。\n\n## 功能列表\n\n- 实时预览\n- 支持粗体和斜体\n- 代码高亮\n\n> 所有数据本地处理';
  mdPreview.innerHTML = simpleMD(mdInput.value);
}
</script>
</body>
</html>
